# Integración continua: se ejecuta en cada push y en cada pull request.
# Si algún paso falla, GitHub marca el commit en rojo.
name: CI

on:
  push:
  pull_request:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: el flujo solo necesita leer el código.
permissions:
  contents: read

env:
  # Valores ficticios solo para compilar y probar (no son secretos).
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_BUSINESS_NAME: Estudio de Prueba
  NEXT_PUBLIC_WHATSAPP_NUMBER: "573001234567"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  calidad:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Pruebas unitarias (Vitest)
        run: npm run test
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Base de datos y pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: calidad
    env:
      # Llaves de Wompi DE MENTIRA (no son secretos): deben ser las mismas de
      # WOMPI_TEST en playwright.config.ts, porque la app se compila con ellas.
      NEXT_PUBLIC_WOMPI_PUBLIC_KEY: pub_test_e2e
      WOMPI_INTEGRITY_SECRET: test_integrity_e2e
      WOMPI_EVENTS_SECRET: test_events_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Iniciar Supabase local (Docker)
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,postgres-meta
      - name: Exportar las claves de Supabase local
        # Son claves de un Supabase de pruebas que solo existe en esta máquina de CI.
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Pruebas de seguridad de la base de datos (pgTAP + RLS)
        run: npx supabase test db
      - name: Compilar la app
        run: npm run build
      - name: Instalar navegadores (Chromium y WebKit/Safari)
        run: npx playwright install --with-deps chromium webkit
      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
