# Dependabot revisa cada semana si hay versiones nuevas (o parches de seguridad)
# de las dependencias y abre un pull request para actualizarlas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
